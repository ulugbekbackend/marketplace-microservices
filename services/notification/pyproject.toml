    [project]
    name = "notification-service"
    version = "0.1.0"
    description = "Notification service"
    requires-python = ">=3.12,<3.13"
    dependencies = [
        "fastapi==0.141.1",
"uvicorn[standard]==0.53.0",
"python-decouple==3.8",
"prometheus-client==0.26.0",
"redis==8.1.0",
        "py-common",
    ]

    [dependency-groups]
    dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1"]

    [tool.uv]
    package = false

    [tool.uv.sources]
    py-common = { workspace = true }

    [tool.pytest.ini_options]
    asyncio_mode = "auto"
    pythonpath = ["."]
    testpaths = ["tests"]
    addopts = "-q"
