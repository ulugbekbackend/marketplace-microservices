[project]
name = "catalog-service"
version = "0.1.0"
description = "Catalog service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==5.2.17",
    "djangorestframework==3.18.1",
    "drf-spectacular==0.30.0",
    "psycopg[binary]==3.3.6",
    "python-decouple==3.8",
    "gunicorn==26.2.0",
    "prometheus-client==0.26.0",
    "django-mptt==0.18.0",
    "django-filter==26.1",
    "pillow==12.3.0",
    "boto3==1.43.99",
    "celery[redis]==5.6.3",
    "redis==8.1.0",
    "unidecode==1.4.0",
    "py-common[drf]",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-django==4.14.0", "factory-boy==3.3.3", "moto[s3]==5.2.3", "pytest-cov==7.1.0", "types-boto3[s3]==1.43.99"]

[tool.uv]
package = false

[tool.uv.sources]
py-common = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["decouple", "drf_spectacular.*", "mptt.*", "django_filters.*", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's task decorator is untyped.
module = ["products.tasks"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff]
extend = "../../pyproject.toml"
# Generated by makemigrations and never edited by hand.
extend-exclude = ["migrations"]

[tool.ruff.lint.isort]
known-first-party = [
    "contracts",
    "py_common",
    "config",
    "messaging",
    "products",
    "sellers",
    "slugs",
    "tests",
]
