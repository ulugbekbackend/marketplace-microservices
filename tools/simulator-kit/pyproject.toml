[project]
name = "simulator-kit"
version = "0.1.0"
description = "Shared parts of the payment provider simulators: a shopper on the gateway and the report"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "python-decouple==3.8"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator_kit"]
artifacts = ["simulator_kit/py.typed"]
