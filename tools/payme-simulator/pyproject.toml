[project]
name = "payme-simulator"
version = "0.1.0"
description = "Plays the Payme side of a payment against the running stack and checks every answer"
requires-python = ">=3.12,<3.13"
dependencies = ["simulator-kit"]

[project.scripts]
payme-simulator = "payme_simulator.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["payme_simulator"]
artifacts = ["payme_simulator/py.typed"]

[tool.uv.sources]
simulator-kit = { workspace = true }
