# Static configuration. Routers and middlewares come from docker labels and dynamic.yml.
entryPoints:
  web:
    address: ":80"
    http:
      middlewares:
        - strip-identity@file
  # Prometheus scrapes this on the internal network; it is not published on the host.
  metrics:
    address: ":8082"

providers:
  docker:
    exposedByDefault: false
    network: marketplace_edge
    watch: true
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

api:
  dashboard: true

metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    addServicesLabels: true

# Enables `traefik healthcheck`, used by the container healthcheck.
ping:
  entryPoint: web

log:
  level: INFO

accessLog:
  format: json
